name: Relatório Diário de Tráfego

on:
  schedule:
    # Executa todos os dias às 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite executar manualmente a partir do GitHub

jobs:
  enviar-trafego:
    runs-on: ubuntu-latest
    steps:
      - name: Obter dados de tráfego via GitHub API
        id: traffic
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const views = await github.rest.repos.getViews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per: 'day'
              });
              
              const clones = await github.rest.repos.getClones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per: 'day'
              });

              // Pegar no total do dia mais recente
              const totalViews = views.data.count;
              const uniqueViews = views.data.uniques;
              const totalClones = clones.data.count;
              const uniqueClones = clones.data.uniques;

              return `👁️ *Visualizações:* ${totalViews} (${uniqueViews} utilizadores únicos)\n📥 *Clones:* ${totalClones} (${uniqueClones} utilizadores únicos)`;
            } catch (error) {
              return `Erro ao obter tráfego: ${error.message}`;
            }

      - name: Enviar relatório para o Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📊 *Relatório Diário de Acessos*
            
            ${{ steps.traffic.outputs.result }}